name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Python formatting
        run: uv run ruff format --check python

      - name: Run Python lints
        run: uv run ruff check python

      - name: Run Python type checks
        run: uv run mypy python/aris python/tests

      - name: Run Rust lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Run Python tests
        run: uv run pytest python/tests

      - name: Check Python stubs
        run: uv run stubtest aris

  publish-crates:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    needs: verify
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish aris
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p aris --locked

      - name: Publish aris-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p aris-cli --locked

  build-rust-cli:
    name: Build Rust CLI (${{ matrix.platform.asset_name }})
    runs-on: ${{ matrix.platform.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            asset_name: aris-cli-linux-x86_64
            binary_path: target/release/aris
          - os: macos-13
            asset_name: aris-cli-macos-x86_64
            binary_path: target/release/aris
          - os: macos-14
            asset_name: aris-cli-macos-aarch64
            binary_path: target/release/aris
          - os: windows-latest
            asset_name: aris-cli-windows-x86_64
            binary_path: target/release/aris.exe
            file_name: aris-cli-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build aris CLI
        run: cargo build -p aris-cli --release --locked

      - name: Prepare Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "${{ matrix.platform.binary_path }}" "dist/${{ matrix.platform.asset_name }}"
          chmod 755 "dist/${{ matrix.platform.asset_name }}"

      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "${{ matrix.platform.binary_path }}" "dist/${{ matrix.platform.file_name }}"

      - name: Upload Rust CLI package
        uses: actions/upload-artifact@v4
        with:
          name: rust-cli-${{ matrix.platform.asset_name }}
          path: dist/*

  build-python-sdist:
    name: Build Python source distribution (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: aris-lib
            working_directory: .
          - name: aris-cli
            working_directory: crates/aris-cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ matrix.package.working_directory }}

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist-${{ matrix.package.name }}
          path: ${{ matrix.package.working_directory }}/dist/*.tar.gz

  build-python-wheels:
    name: Build Python wheels (${{ matrix.package.name }}, ${{ matrix.platform.os }}, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: aris-lib
            working_directory: .
          - name: aris-cli
            working_directory: crates/aris-cli
        platform:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-13
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter --compatibility pypi --locked
          working-directory: ${{ matrix.package.working_directory }}
          sccache: true
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.package.name }}-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: ${{ matrix.package.working_directory }}/dist/*.whl

  publish-python-lib:
    name: Publish Python package (aris-lib)
    runs-on: ubuntu-latest
    needs:
      - build-python-sdist
      - build-python-wheels
      - publish-crates
    environment:
      name: pypi
      url: https://pypi.org/p/aris-lib
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download Python distributions for aris-lib
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-*-aris-lib*
          merge-multiple: true

      - name: Publish aris-lib to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-python-cli:
    name: Publish Python package (aris-cli)
    runs-on: ubuntu-latest
    needs:
      - build-python-sdist
      - build-python-wheels
      - publish-crates
    environment:
      name: pypi
      url: https://pypi.org/p/aris-cli
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download Python distributions for aris-cli
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-*-aris-cli*
          merge-multiple: true

      - name: Publish aris-cli to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-rust-cli
      - publish-python-lib
      - publish-python-cli
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Rust release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rust-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

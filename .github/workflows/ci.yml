name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Python formatting
        run: uv run ruff format --check python

      - name: Run Python lints
        run: uv run ruff check python

      - name: Run Python type checks
        run: uv run mypy python/aris python/tests

      - name: Run Rust lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Run Python tests
        run: uv run pytest python/tests

      - name: Check Python stubs
        run: uv run stubtest aris
